name: Update external data

on:
  schedule:
    - cron: '0 3 * * *' 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger le fichier si le cache est manquant
        run: |
          FILE_URL="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/rappelconso-v2-gtin-espaces/exports/json/?lang=fr"
          DEST="public/rappels.json"
          curl -fSL "$FILE_URL" -o "$DEST"

      - name: Vérifier le fichier
        run: |
          if [[ ! -s public/rappels.json ]]; then
            echo "❌ Fichier vide ou manquant"
            exit 1
          fi

      - name: Commit du fichier mis à jour
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add public/rappels.json
          git commit -m "Update rappels.json"
          git push
